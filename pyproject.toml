[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "splicr-tts"
version = "0.1.0"
description = "Provider-neutral long-document text-to-speech microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<50",
  "fastapi>=0.115,<1",
  "google-genai>=2.3,<3",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
splicr = "splicr.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splicr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live_provider: opt-in contract test that calls a real provider and may consume quota",
  "live_engine: opt-in contract test that loads a configured local model environment",
  "release_acceptance: slower release-level acceptance or soak test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy/narrator"]
