name: splicr

services:
  app:
    image: ${SPLICR_IMAGE:-splicr:local}
    build:
      context: .
      target: runtime
      args:
        INSTALL_LEGACY_DOC_SUPPORT: ${SPLICR_INSTALL_LEGACY_DOC_SUPPORT:-1}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=1g,mode=1777
    env_file:
      - ${SPLICR_ENV_FILE:-.env}
    environment:
      SPLICR_DATA_DIR: /data
      SPLICR_SECRET_VAULT_BACKEND: encrypted-file
      SPLICR_SECRET_VAULT_KEY_FILE: /run/secrets/splicr_vault_key
      SPLICR_SECRET_VAULT_PATH: /data/secrets/api-resources.vault
    ports:
      - "${SPLICR_BIND_ADDRESS:-127.0.0.1}:${SPLICR_HTTP_PORT:-8000}:8000"
    volumes:
      - splicr-data:/data
    secrets:
      - source: splicr_vault_key
        target: splicr_vault_key
        mode: 0444
    logging:
      driver: json-file
      options:
        max-size: ${SPLICR_LOG_MAX_SIZE:-10m}
        max-file: ${SPLICR_LOG_MAX_FILES:-5}

volumes:
  splicr-data:

secrets:
  splicr_vault_key:
    file: ${SPLICR_VAULT_KEY_FILE:-.secrets/vault.key}
