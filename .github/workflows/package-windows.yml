name: Package Windows desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label (for example 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-collector-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify the pinned FFmpeg dependency source plan
        shell: bash
        run: |
          set -euo pipefail
          lock=packaging/windows/ffmpeg-source-lock.json
          recipe_url="$(
            jq -r \
              '.primary_source_archives[] | select(.name == "BtbN FFmpeg build recipes") | .url' \
              "$lock"
          )"
          recipe_sha="$(
            jq -r \
              '.primary_source_archives[] | select(.name == "BtbN FFmpeg build recipes") | .sha256' \
              "$lock"
          )"
          recipe_archive="$RUNNER_TEMP/btbn-build-scripts.zip"
          recipe_root="$RUNNER_TEMP/btbn-recipes"
          curl --fail --location --retry 3 "$recipe_url" --output "$recipe_archive"
          printf '%s  %s\n' "$recipe_sha" "$recipe_archive" | sha256sum --check --strict
          mkdir -p "$recipe_root"
          unzip -q "$recipe_archive" -d "$recipe_root"
          extracted_root="$(find "$recipe_root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$extracted_root"
          bash packaging/windows/test-ffmpeg-source-collector.sh "$extracted_root"
          bash packaging/windows/test-ffmpeg-source-license-inventory.sh
          bash packaging/windows/test-ffmpeg-source-license-review.sh

  package:
    needs: source-collector-plan
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio-web/package-lock.json

      - name: Install locked build tools
        shell: pwsh
        run: |
          python -m pip install "uv==0.11.26"
          choco install innosetup --yes --no-progress
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath;$env:Path"
          "PATH=$env:Path" >> $env:GITHUB_ENV

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests and build installer
        shell: pwsh
        run: |
          uv sync --frozen --extra dev
          uv run ruff check .
          uv run pytest -q
          .\packaging\windows\test-fetch-ffmpeg-lgpl.ps1
          $ffmpegBin = .\packaging\windows\fetch-ffmpeg-lgpl.ps1
          .\packaging\windows\build.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -FfmpegBin $ffmpegBin

      - name: Accept portable and installer artifacts
        shell: pwsh
        run: |
          .\packaging\windows\test-package.ps1 `
            -Version "${{ steps.version.outputs.version }}"

      - name: Prepare FFmpeg primary-source audit material
        shell: pwsh
        run: |
          .\packaging\windows\test-ffmpeg-source-graph.ps1
          .\packaging\windows\prepare-ffmpeg-source-audit.ps1 `
            -Version "${{ steps.version.outputs.version }}"
          .\packaging\windows\test-ffmpeg-source-audit.ps1 `
            -Version "${{ steps.version.outputs.version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPLICR-Studio-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            dist/SPLICR-Studio-${{ steps.version.outputs.version }}-Windows-x64-portable.zip
            dist/SPLICR-Studio-${{ steps.version.outputs.version }}-Windows-x64-setup.exe
            dist/SPLICR-Studio-${{ steps.version.outputs.version }}-SHA256SUMS.txt
            dist/SPLICR-Studio-${{ steps.version.outputs.version }}-Windows-x64-ACCEPTANCE.json
            dist/SPLICR-Studio-${{ steps.version.outputs.version }}-FFmpeg-primary-source-audit.zip
            dist/SPLICR-Studio-${{ steps.version.outputs.version }}-FFmpeg-primary-source-audit-SHA256.txt
          if-no-files-found: error
          retention-days: 30
