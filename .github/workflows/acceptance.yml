name: Browser acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  studio-browser:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio-web/package-lock.json

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install "uv==0.11.26"
          uv sync --frozen --extra dev
          npm --prefix studio-web ci
          npm --prefix studio-web exec -- playwright install chromium

      - name: Install pinned media tools
        shell: pwsh
        run: |
          $ffmpegBin = python .\packaging\windows\fetch_ffmpeg_release.py
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $ffmpegBin "ffmpeg.exe") -version | Select-Object -First 1
          & (Join-Path $ffmpegBin "ffprobe.exe") -version | Select-Object -First 1

      - name: Build and run browser acceptance
        shell: pwsh
        run: |
          npm --prefix studio-web run build
          npm --prefix studio-web run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            studio-web/playwright-report/
            studio-web/test-results/
          if-no-files-found: ignore
          retention-days: 14
